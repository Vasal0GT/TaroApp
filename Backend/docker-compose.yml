services:
  postgres:
    image: postgres:16
    container_name: taro-postgres
    environment:
      POSTGRES_DB: taro
      POSTGRES_USER: taro
      POSTGRES_PASSWORD: taro
    ports:
      - "5432:5432"
    volumes:
      - taro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taro -d taro"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: taro-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: taro
      RABBITMQ_DEFAULT_PASS: taro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: taro-api
    build:
      context: ./Taro.Backend
      dockerfile: src/Taro.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=taro;Username=taro;Password=taro

      Jwt__Issuer: Taro
      Jwt__Audience: Taro.Mobile
      Jwt__Secret: THIS_IS_DEV_SECRET_CHANGE_IT_LATER_1234567890_ABCDE
      Jwt__AccessTokenMinutes: "15"

      Mail__Host: mailpit
      Mail__Port: "1025"
      Mail__UseSsl: "false"
      Mail__Username: ""
      Mail__Password: ""
      Mail__FromEmail: no-reply@taro.local
      Mail__FromName: Taro

      ExternalAuth__GoogleAudiences__0: YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com
      ExternalAuth__GoogleAudiences__1: YOUR_GOOGLE_IOS_CLIENT_ID.apps.googleusercontent.com
      ExternalAuth__GoogleAudiences__2: YOUR_GOOGLE_ANDROID_CLIENT_ID.apps.googleusercontent.com

      ExternalAuth__AppleAudiences__0: host.exp.Exponent
      ExternalAuth__AppleAudiences__1: com.sasha.taro

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: taro
      RabbitMQ__Password: taro
      RabbitMQ__QueueName: tarot-readings

      YooKassa__ShopId: 1392577
      YooKassa__SecretKey: test_5dby668PwfF9UGJCogYuI39Se633xkgGo_wd2vZnaeg
      YooKassa__ReturnUrl: https://example.com/payment-return

      BillingPortal__BaseUrl: http://localhost:3000
      BillingPortal__AccessTokenMinutes: "120"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    container_name: taro-worker
    build:
      context: ./Taro.Backend
      dockerfile: src/Taro.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development

      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=taro;Username=taro;Password=taro

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: taro
      RabbitMQ__Password: taro
      RabbitMQ__QueueName: tarot-readings

      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: gpt-5.4-mini

      YooKassa__ShopId: 1392577
      YooKassa__SecretKey: test_5dby668PwfF9UGJCogYuI39Se633xkgGo_wd2vZnaeg
      YooKassa__ReturnUrl: https://example.com/payment-return

      ReadingWorker__OpenAiRequestsPerSecond: "7"
      ReadingWorker__ConcurrentMessageLimit: "20"
      ReadingWorker__PrefetchCount: "20"

      OpenAI__MaxAttempts: "4"
      OpenAI__RetryBaseDelaySeconds: "2"
      OpenAI__RetryMaxDelaySeconds: "20"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  taro_postgres_data: