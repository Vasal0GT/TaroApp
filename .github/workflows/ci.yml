name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build backend
        run: dotnet build Backend/Taro.Backend/Taro.Backend.slnx --configuration Release
      - name: Build transcription utility
        run: dotnet build Backend/SongTranscriber/SongTranscriber.slnx --configuration Release

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TaroApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TaroApp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
